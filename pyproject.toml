[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmx-docs"
version = "0.1.0"
description = "Index file-server documentation (PDF, Word) and chat with it through Claude via MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "mcp>=1.2",
    "numpy>=1.26",
    "fastembed>=0.4",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dmx-docs = "dmx_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
